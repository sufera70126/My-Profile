<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Profile Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .form-section, .profile-section {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 300px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px;
            width: 100%;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .profile-header {
            text-align: center;
        }
        .section {
            margin-top: 15px;
        }
        .section h3 {
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Form -->
    <div class="form-section">
        <h2>Enter Your Details</h2>
        <input type="text" id="name" value="Sufera Kunni">
        <input type="text" id="title" value="MSc IT Student">
        <textarea id="about">I am a student studying MSc IT.</textarea>
        <input type="text" id="skills" placeholder="Skills (comma separated)">
        <input type="email" id="email" value="suferakuunhi@gmail.com">

        <button onclick="generateProfile()">Generate Profile</button>
    </div>

    <!-- Profile -->
    <div class="profile-section">
        <div class="profile-header">
            <h1 id="pName">Sufera Kunni</h1>
            <p id="pTitle">MSc IT Student</p>
        </div>

        <div class="section">
            <h3>About Me</h3>
            <p id="pAbout">I am a student studying MSc IT.</p>
        </div>

        <div class="section">
            <h3>Skills</h3>
            <ul id="pSkills"></ul>
        </div>

        <div class="section">
            <h3>Contact</h3>
            <p id="pEmail">suferakuunhi@gmail.com</p>
        </div>
    </div>

</div>

<script>
function generateProfile() {
    let name = document.getElementById("name").value;
    let title = document.getElementById("title").value;
    let about = document.getElementById("about").value;
    let skills = document.getElementById("skills").value.split(",");
    let email = document.getElementById("email").value;

    document.getElementById("pName").innerText = name;
    document.getElementById("pTitle").innerText = title;
    document.getElementById("pAbout").innerText = about;
    document.getElementById("pEmail").innerText = email;

    let skillsList = document.getElementById("pSkills");
    skillsList.innerHTML = "";
    skills.forEach(skill => {
        if(skill.trim() !== "") {
            let li = document.createElement("li");
            li.innerText = skill.trim();
            skillsList.appendChild(li);
        }
    });
}
</script>

</body>
</html>
